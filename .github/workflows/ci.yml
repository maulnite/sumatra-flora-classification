name: Starter checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  basic-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python
        run: python -m compileall -q scripts tests src
      - name: Run synthetic unit tests
        run: python -m unittest discover -s tests -v
